spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# User/Auth/Profile service (combined)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://profile-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=profile-service
spring.cloud.gateway.routes[1].uri=lb://profile-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/profiles/**

spring.cloud.gateway.routes[2].id=effort-service
spring.cloud.gateway.routes[2].uri=lb://effort-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/efforts/**

spring.cloud.gateway.routes[3].id=reward-service
spring.cloud.gateway.routes[3].uri=lb://reward-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/rewards/**

# CORS is configured only here. Do not add another Access-Control-Allow-Origin in the services.
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
